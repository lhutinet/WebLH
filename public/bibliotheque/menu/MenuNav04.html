<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Mensocial</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="button">
        <div class="icon"><i class="fab fa-facebook-f"></i></div>
        <span>Facebook</span>
      </div>

      <div class="button">
        <div class="icon"><i class="fab fa-twitter"></i></div>
        <span>Twitter</span>
      </div>

      <div class="button">
        <div class="icon"><i class="fab fa-instagram"></i></div>
        <span>Instagram</span>
      </div>

      <div class="button">
        <div class="icon"><i class="fab fa-github"></i></div>
        <span>Github</span>
      </div>

      <div class="button">
        <div class="icon"><i class="fab fa-youtube"></i></div>
        <span>Youtube</span>
      </div>
    </div>
  </body>
</html>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'poppins', sans-serif;
  }
  html,
  body {
    display: grid;
    height: 100%;
    width: 100%;
    place-items: center;
    background: linear-gradient(315deg, #ffffff 0%, #d7e1ec 74%);
  }

  .wrapper .button {
    display: inline-block;
    height: 60px;
    width: 60px;
    border-radius: 6cqmin;
    float: left;
    margin: 0 5px;
    background: #fff;
    cursor: pointer;
    box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease-out;
    overflow: hidden;
  }
  .wrapper .button:hover {
    width: 200px;
  }

  .wrapper .button .icon {
    display: inline-block;
    height: 60px;
    width: 60px;
    border-radius: 60px;
    line-height: 60px;
    text-align: center;
    transition: all 0.3s ease-out;
  }
  .wrapper .button .icon i {
    font-size: 25px;
    line-height: 60px;
    transition: all 0.3s ease-out;
  }
  .wrapper .button:hover .icon i {
    color: #fff;
  }

  .wrapper .button:nth-child(1):hover .icon {
    background: #4267b2;
  }
  .wrapper .button:nth-child(2):hover .icon {
    background: #1da1f2;
  }
  .wrapper .button:nth-child(3):hover .icon {
    background: #e1306c;
  }
  .wrapper .button:nth-child(4):hover .icon {
    background: #333;
  }
  .wrapper .button:nth-child(5):hover .icon {
    background: #ff0000;
  }

  .wrapper .button span {
    font-size: 20px;
    font-weight: 500;
    line-height: 60px;
    margin-left: 10px;
    transition: all 0.3s ease-out;
  }
  .wrapper .button:nth-child(1):hover span {
    color: #4267b2;
  }
  .wrapper .button:nth-child(2):hover span {
    color: #1da1f2;
  }
  .wrapper .button:nth-child(3):hover span {
    color: #e1306c;
  }
  .wrapper .button:nth-child(4):hover span {
    color: #333;
  }
  .wrapper .button:nth-child(5):hover span {
    color: #ff0000;
  }
</style>
